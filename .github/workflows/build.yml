name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Universal VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target AmbikaVST_VST3 AmbikaVST_AU AmbikaVST_Standalone -- -quiet

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AmbikaVST_artefacts/Release/AU/Ambika VST.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Amb6 Ambp || (echo "auval failed" && exit 1)

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --skip-gui-tests "build/AmbikaVST_artefacts/Release/VST3/Ambika VST.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/AmbikaVST_artefacts/Release/VST3/Ambika VST.vst3" dist/
          cp -R "build/AmbikaVST_artefacts/Release/AU/Ambika VST.component" dist/
          cp -R "build/AmbikaVST_artefacts/Release/Standalone/Ambika VST.app" dist/
          # Ad-hoc signature so the bundles load on Apple Silicon.
          codesign --force --deep --sign - "dist/Ambika VST.vst3" "dist/Ambika VST.component" "dist/Ambika VST.app"
          cp README.md LICENSE dist/
          cd dist && zip -qry ../AmbikaVST-macOS.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: AmbikaVST-macOS
          path: AmbikaVST-macOS.zip

      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "${TAG}" AmbikaVST-macOS.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "Ambika VST ${TAG}" \
            --notes "Fertiges Plugin für macOS (Universal: Apple Silicon + Intel): VST3, AU und Standalone-App. Installation siehe README."

  linux:
    name: Linux (VST3, engine tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target AmbikaVST_VST3 ambika_render_test ambika_preset_test -j4
      - name: Engine & preset tests
        run: |
          mkdir -p out
          ./build/ambika_render_test out
          xvfb-run ./build/ambika_preset_test_artefacts/Release/ambika_preset_test
